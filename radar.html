<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDR Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b0e;--c1:#00f2fe;--c2:#a855f7;--txt:#f4f4f8;--mut:rgba(244,244,248,.55);--bad:#ff453a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 15%,rgba(0,242,254,.16),transparent 40%),radial-gradient(circle at 85% 60%,rgba(168,85,247,.2),transparent 45%)}
button,textarea{font:inherit;color:inherit}
.app{width:100%;max-width:420px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
header{display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.12em;font-size:20px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.1em;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,242,254,.4);color:var(--c1)}
.pill.off{color:var(--bad);border-color:rgba(255,69,58,.4)}
.box{padding:18px;display:grid;gap:12px;min-width:0}
.name{font-size:20px;font-weight:700}
.sub{font-size:13px;color:var(--mut)}
textarea{width:100%;height:84px;resize:none;outline:none;padding:12px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,242,254,.15)}
input[type=file]{font-size:13px;color:var(--mut)}
.btn{all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:16px;font-weight:800;background:linear-gradient(90deg,var(--c1),var(--c2));color:#0b0b0e}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.97)}
.media{width:100%;max-height:260px;border-radius:16px;object-fit:cover;background:#000}
.carousel{overflow:hidden;border-radius:24px}
.track{display:flex;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;min-width:0;padding:2px}
.nav{display:flex;align-items:center;justify-content:space-between}
.arrow{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);transition:transform .3s;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:90%;white-space:normal;text-align:center}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">RDR</div>
    <div class="pill off" id="conn">OFFLINE</div>
  </header>

  <section class="glass box" id="mine">
    <div class="sub">Мой статус</div>
    <textarea id="text" maxlength="280" placeholder="Что у вас нового?"></textarea>
    <input type="file" id="file" accept="image/jpeg,image/png,video/mp4">
    <button class="btn" id="save">Сохранить</button>
  </section>

  <div class="sub">Участники хаба</div>
  <section class="carousel"><div class="track" id="track"></div></section>
  <nav class="nav">
    <button class="arrow" id="prev" aria-label="Назад">‹</button>
    <span class="sub" id="pos"></span>
    <button class="arrow" id="next" aria-label="Вперёд">›</button>
  </nav>
</div>

<div class="toast glass" id="toast" role="status"></div>

<script>
/* ============ Настройки ============ */
// Адрес бэкенда. Если туннель перезапущен, адрес меняется: обновите строку ниже.
const API = 'https://poor-testament-muslim-lafayette.trycloudflare.com/api';
const BASE = API.replace(/\/api$/, '');

/* ============ Утилиты ============ */
const TG = window.Telegram?.WebApp ?? null;
if (TG) { TG.ready(); TG.expand(); }
const $ = s => document.querySelector(s);
const rtf = new Intl.RelativeTimeFormat('ru', { numeric: 'auto' });
// updated_at приходит в секундах
const rel = sec => {
  if (!sec) return 'нет статуса';
  const m = Math.round((sec * 1000 - Date.now()) / 6e4);
  return Math.abs(m) < 1 ? 'только что' : rtf.format(m, 'minute');
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}
function setConn(on) {
  const p = $('#conn');
  p.classList.toggle('off', !on);
  p.textContent = on ? 'ONLINE' : 'OFFLINE';
}

/* ============ Запросы к бэкенду ============ */
// Заголовок Authorization: tma <initData> подтверждает, кто делает запрос
async function api(path, opts = {}) {
  if (!TG?.initData) throw new Error('Откройте приложение из Telegram через бота');
  const r = await fetch(API + path, {
    ...opts,
    headers: { Authorization: 'tma ' + TG.initData, ...(opts.headers || {}) },
  });
  if (r.status === 401) throw new Error('Telegram не подтвердил вход. Откройте из бота заново.');
  if (!r.ok) throw new Error(`Ошибка сервера: ${r.status}`);
  return r.json();
}

/* ============ Состояние и отрисовка ============ */
let members = [];
let idx = 0;

function renderTrack() {
  const others = members.filter(m => !m.is_me);
  if (!others.length) {
    $('#track').innerHTML = '<div class="slide"><div class="glass box"><div class="sub">Пока никого нет в хабе</div></div></div>';
    $('#pos').textContent = '';
    return;
  }
  if (idx >= others.length) idx = 0;
  $('#track').innerHTML = others.map(m => {
    const url = m.media_url ? BASE + m.media_url : '';
    const media = !url ? '' : /\.mp4$/i.test(url)
      ? `<video class="media" src="${esc(url)}" controls playsinline></video>`
      : `<img class="media" src="${esc(url)}" alt="">`;
    return `
    <div class="slide"><div class="glass box">
      <div class="name">${esc(m.first_name)}</div>
      <div class="sub">${m.username ? '@' + esc(m.username) + ' · ' : ''}${rel(m.updated_at)}</div>
      ${media}
      <div>${esc(m.status_text) || '—'}</div>
    </div></div>`;
  }).join('');
  go(0);
}

function go(n) {
  const others = members.filter(m => !m.is_me);
  if (!others.length) return;
  idx = (idx + n + others.length) % others.length;
  $('#track').style.transform = `translateX(-${idx * 100}%)`;
  $('#pos').textContent = `${idx + 1} / ${others.length}`;
}

async function load() {
  try {
    const [me, hub] = await Promise.all([api('/me'), api('/hub')]);
    // Поле текста заполняем только если пользователь не печатает сейчас
    if (document.activeElement !== $('#text')) $('#text').value = me.status_text || '';
    members = hub.members;
    renderTrack();
    setConn(true);
  } catch (e) {
    setConn(false);
    toast(e.message);
  }
}

/* ============ Сохранение своего статуса ============ */
$('#save').addEventListener('click', async () => {
  const fd = new FormData();
  fd.append('status_text', $('#text').value.trim());
  const file = $('#file').files[0];
  if (file) fd.append('file', file);
  $('#save').disabled = true;
  try {
    await api('/update', { method: 'POST', body: fd });
    $('#file').value = '';
    TG?.HapticFeedback?.notificationOccurred('success');
    toast('Статус сохранён');
    await load();
  } catch (e) {
    toast(e.message);
  } finally {
    $('#save').disabled = false;
  }
});

/* ============ Навигация по карусели ============ */
$('#prev').addEventListener('click', () => go(-1));
$('#next').addEventListener('click', () => go(1));

let sx = 0, sy = 0;
const carousel = document.querySelector('.carousel');
carousel.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
carousel.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, { passive: true });

/* ============ Старт ============ */
load();
setInterval(load, 30000);
</script>
</body>
</html>

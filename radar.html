<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RDR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #131822;
      --text: #eef2f7;
      --muted: #8b95a7;
      --accent: #3b82f6;
      --ok: #22c55e;
      --err: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .status {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    pre {
      margin: 12px 0 0;
      padding: 12px;
      background: #090c11;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 12px;
      color: #cbd5e1;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <span id="statusDot" class="dot"></span>
        <span>RDR</span>
      </div>
      <span id="envBadge" style="color: var(--muted); font-size: 13px;">локальный режим</span>
    </div>

    <div class="card">
      <div id="statusText" class="status">Подключение...</div>
      <button id="retryBtn" type="button" onclick="initApp()">Повторить</button>
      <pre id="debugBox" hidden></pre>
    </div>
  </div>

  <script>
    const API_BASE =
      window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? `${window.location.protocol}//${window.location.hostname}:8000`
        : window.location.origin;

    let sessionToken = "";

    function setState(text, mode = "loading", details = null) {
      const statusEl = document.getElementById("statusText");
      const dotEl = document.getElementById("statusDot");
      const debugEl = document.getElementById("debugBox");
      statusEl.textContent = text;
      dotEl.className = `dot ${mode === "ok" ? "ok" : mode === "err" ? "err" : ""}`;
      if (details) {
        debugEl.hidden = false;
        debugEl.textContent = typeof details === "string" ? details : JSON.stringify(details, null, 2);
      } else {
        debugEl.hidden = true;
        debugEl.textContent = "";
      }
    }

    async function ensureMiniAppToken() {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        try { tg.ready(); tg.expand(); } catch (_) {}
      }
      const initData = tg && tg.initData ? tg.initData : "";
      document.getElementById("envBadge").textContent = initData ? "Telegram Mini App" : "Браузер (без initData)";

      if (!initData) {
        return { ok: false, reason: "Нет initData от Telegram (открыто вне Mini App)" };
      }

      const resp = await fetch(`${API_BASE}/api/miniapp/auth`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ init_data: initData })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.token) {
        return { ok: false, reason: data.detail || `Ошибка авторизации (${resp.status})`, raw: data };
      }
      sessionToken = data.token;
      return { ok: true, user: data.user || null };
    }

    async function initApp() {
      setState("Подключение...", "loading");
      try {
        const auth = await ensureMiniAppToken();
        if (!auth.ok) {
          setState(
            "Сервер доступен, но вход из браузера без Telegram initData не выполнен. Открой мини-приложение внутри Telegram.",
            "loading",
            { api_base: API_BASE, reason: auth.reason }
          );
          return;
        }

        const userId = auth.user && auth.user.id ? auth.user.id : "me";
        const headers = sessionToken ? { Authorization: `Bearer ${sessionToken}` } : {};
        const statusResp = await fetch(`${API_BASE}/api/status/${encodeURIComponent(userId)}`, { headers });
        const statusData = await statusResp.json().catch(() => ({}));

        if (!statusResp.ok) {
          setState(`Ошибка запроса статуса (${statusResp.status})`, "err", statusData);
          return;
        }

        setState("Подключено", "ok", statusData);
      } catch (err) {
        setState(`Ошибка соединения с сервером: ${err && err.message ? err.message : err}`, "err");
      }
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>

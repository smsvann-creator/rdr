<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RDR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b0e;--c1:#00f2fe;--c2:#a855f7;--txt:#f4f4f8;--mut:rgba(244,244,248,.55);--bad:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 15%,rgba(0,242,254,.16),transparent 40%),radial-gradient(circle at 85% 60%,rgba(168,85,247,.2),transparent 45%)}
button{font:inherit;color:inherit}

.app{width:100%;max-width:420px;margin:0 auto;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}

header{display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:.12em;font-size:20px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello{font-size:14px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hello b{color:var(--txt);font-weight:600}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.1em;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,242,254,.4);color:var(--c1)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px var(--c1);animation:pulse 1.6s infinite}
.status.off{color:var(--bad);border-color:rgba(255,69,58,.4)}
.status.off i{background:var(--bad);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}

.ghost{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:16px;border:1px solid rgba(0,242,254,.35);color:var(--c1);font-weight:600;font-size:14px}

.carousel{overflow:hidden;border-radius:24px;touch-action:pan-y}
.track{display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slide{padding:2px;min-width:0}
.card{padding:18px;display:grid;gap:14px}

.person{display:flex;align-items:center;gap:14px}
.avatar{flex:0 0 64px;width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--c),var(--c2),var(--c))}
.avatar span{width:100%;height:100%;border-radius:50%;background:#15151b;display:grid;place-items:center;font-size:30px}
.name{font-size:20px;font-weight:700}
.sub{font-size:13px;color:var(--mut)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);min-width:0}
.stat small{display:block;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.stat b{font-size:16px;font-weight:700}
.bat{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bat i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}

.player{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
.play{all:unset;cursor:pointer;flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0b0b0e;font-size:16px;box-shadow:0 0 18px rgba(0,242,254,.35)}
.eq{flex:1;height:34px;display:flex;align-items:flex-end;gap:3px;min-width:0}
.eq i{flex:1;background:var(--c1);border-radius:2px;opacity:.45}
.player.playing .eq i{opacity:1;animation:eq .9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes eq{from{height:15%!important}to{height:100%!important}}
.time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mut);min-width:34px;text-align:right}

.circle-row{display:flex;align-items:center;gap:14px}
.vnote{all:unset;cursor:pointer;flex:0 0 96px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 30% 25%,#1e2a4a,#0b0b0e);box-shadow:0 0 0 2px var(--c2),0 0 22px rgba(168,85,247,.45)}
.vnote.playing{animation:vpulse 1.2s ease-in-out infinite}
@keyframes vpulse{50%{box-shadow:0 0 0 2px var(--c1),0 0 30px rgba(0,242,254,.55)}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{all:unset;cursor:pointer;text-align:center;padding:14px 10px;border-radius:18px;font-weight:700;font-size:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:transform .15s}
.act:active{transform:scale(.96)}
.act.bump{color:var(--c1);border-color:rgba(0,242,254,.45);box-shadow:0 0 18px rgba(0,242,254,.18)}
.act.reply{color:#d9b3ff;border-color:rgba(168,85,247,.5)}
.card.bumping{animation:bumpPulse .6s ease-out}
@keyframes bumpPulse{from{box-shadow:0 0 0 0 rgba(0,242,254,.6)}to{box-shadow:0 0 0 30px rgba(0,242,254,0)}}

.nav{display:flex;align-items:center;justify-content:space-between}
.arrow{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
.dots i.on{width:20px;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}

.sheet{position:fixed;left:50%;bottom:0;width:min(420px,100%);z-index:5;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;display:grid;gap:12px;transform:translate(-50%,110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.sh-head{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px}
.sheet textarea{width:100%;height:84px;resize:none;outline:none;padding:12px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:var(--txt);font:inherit}
.sheet textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,242,254,.15)}
.row{display:flex;gap:10px}
.row button{all:unset;cursor:pointer;flex:1;text-align:center;padding:14px;border-radius:16px;font-weight:700}
.cancel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.send{background:linear-gradient(90deg,var(--c1),var(--c2));color:#0b0b0e}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">RDR</div>
    <div class="hello">Привет, <b id="greet">Тест</b></div>
    <div class="status" id="status"><i></i><span>ONLINE</span></div>
  </header>

  <button class="ghost" id="btnHome" hidden>＋ На главный экран</button>

  <section class="carousel" id="carousel" aria-label="Друзья">
    <div class="track" id="track"></div>
  </section>

  <nav class="nav">
    <button class="arrow" id="prev" aria-label="Назад">‹</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Вперёд">›</button>
  </nav>
</div>

<div class="sheet glass" id="sheet" role="dialog" aria-label="Быстрый ответ">
  <div class="sh-head"><span id="shTo"></span><button class="arrow" id="shClose" aria-label="Закрыть">×</button></div>
  <div class="chips">
    <button type="button">Я уже еду 🚗</button>
    <button type="button">Где ты?</button>
    <button type="button">Ок 👍</button>
  </div>
  <textarea id="msg" maxlength="300" placeholder="Сообщение…"></textarea>
  <div class="row">
    <button class="cancel" id="shCancel">Отмена</button>
    <button class="send" id="send">Отправить</button>
  </div>
</div>

<div class="toast glass" id="toast" role="status"></div>

<script>
/* ============ Настройки ============ */
// Адрес API для реальной отправки (например, '/api/reply' на вашем сервере). Пусто = демо.
const API = '';

/* ============ Данные (тестовые) ============ */
const FRIENDS = [
  { id: 1, name: 'Димон',    avatar: '🐺', color: '#00f2fe', district: 'Патриаршие', battery: 76, updated: Date.now() - 4 * 60e3,  voice: { dur: 12 }, circle: { dur: 8 } },
  { id: 2, name: 'Любимая',  avatar: '🌸', color: '#a855f7', district: 'Арбат',      battery: 43, updated: Date.now() - 1 * 60e3,  voice: { dur: 7 },  circle: { dur: 5 } },
  { id: 3, name: 'Макс',     avatar: '🦊', color: '#ff8a65', district: 'Сокольники', battery: 18, updated: Date.now() - 14 * 60e3, voice: { dur: 9 },  circle: { dur: 6 } },
];
const N = FRIENDS.length;

/* ============ Утилиты ============ */
const $ = s => document.querySelector(s);
const track = $('#track');
const rtf = new Intl.RelativeTimeFormat('ru', { numeric: 'auto' });
const rel = t => { const m = Math.round((t - Date.now()) / 6e4); return Math.abs(m) < 1 ? 'только что' : rtf.format(m, 'minute'); };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const TG = window.Telegram?.WebApp ?? null;

function haptic(kind) {
  const h = TG?.HapticFeedback;
  if (h) return kind === 'success' ? h.notificationOccurred('success') : h.impactOccurred('medium');
  navigator.vibrate?.(kind === 'success' ? [20, 40, 20] : 30);
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
async function post(i, payload) {
  if (!API) return;
  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'tma ' + (TG?.initData || '') },
      body: JSON.stringify({ to: FRIENDS[i].id, ...payload }),
    });
  } catch { toast('Нет связи с сервером'); }
}

/* ============ Рендер ============ */
const card = (f, i) => `
<article class="slide" data-i="${i}">
  <div class="glass card">
    <div class="person">
      <div class="avatar" style="--c:${f.color}"><span>${f.avatar}</span></div>
      <div><div class="name">${f.name}</div><div class="sub">📍 ${f.district}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><small>Заряд</small><b>${f.battery}%</b><div class="bat"><i style="width:${f.battery}%"></i></div></div>
      <div class="stat"><small>Обновлено</small><b class="upd" data-upd="${i}"></b></div>
    </div>
    <div class="player">
      <button class="play" data-play="voice" aria-label="Слушать">▶</button>
      <div class="eq">${Array.from({ length: 14 }, (_, k) =>
        `<i style="--d:${(k * 0.07).toFixed(2)}s;height:${20 + ((k * 37) % 60)}%"></i>`).join('')}</div>
      <span class="time t-voice">${fmt(f.voice.dur)}</span>
    </div>
    <div class="circle-row">
      <button class="vnote" data-play="circle" aria-label="Смотреть кружок">${f.avatar}</button>
      <div><div class="sub">Видео-кружок</div><div class="time t-circle" style="text-align:left">${fmt(f.circle.dur)}</div></div>
    </div>
    <div class="actions">
      <button class="act bump" data-bump="${i}">⚡ Бамп (Пинг)</button>
      <button class="act reply" data-reply="${i}">💬 Быстрый ответ</button>
    </div>
  </div>
</article>`;

function render() {
  track.style.width = `${N * 100}%`;
  track.innerHTML = FRIENDS.map(card).join('');
  track.querySelectorAll('.slide').forEach(s => (s.style.flex = `0 0 ${100 / N}%`));
  renderDots();
  refreshTimes();
}
function renderDots() {
  $('#dots').innerHTML = FRIENDS.map((_, k) => `<i class="${k === idx ? 'on' : ''}"></i>`).join('');
}
function refreshTimes() {
  document.querySelectorAll('[data-upd]').forEach(el => (el.textContent = rel(FRIENDS[+el.dataset.upd].updated)));
}

/* ============ Карусель ============ */
let idx = 0;
function go(n) {
  stopPlay();
  idx = (idx + n + N) % N;
  track.style.transform = `translateX(-${idx * 100 / N}%)`;
  renderDots();
}

/* ============ Плеер (демо-таймер; для реального аудио подставьте <audio src>) ============ */
let cur = null;
function stopPlay() {
  if (!cur) return;
  const c = cur;
  cur = null;
  clearInterval(c.h);
  c.surface.classList.remove('playing');
  if (c.kind === 'voice') c.btn.textContent = '▶';
  c.tEl.textContent = fmt(c.dur);
}
function startPlay(i, kind) {
  stopPlay();
  const slide = track.children[i];
  const btn = slide.querySelector(`[data-play="${kind}"]`);
  const surface = kind === 'voice' ? slide.querySelector('.player') : btn;
  const tEl = slide.querySelector(kind === 'voice' ? '.t-voice' : '.t-circle');
  const dur = FRIENDS[i][kind].dur;
  const c = { kind, t: 0, dur, btn, surface, tEl, h: 0 };
  c.h = setInterval(() => {
    c.t = Math.min(dur, c.t + 0.1);
    c.tEl.textContent = fmt(c.t);
    if (c.t >= dur) stopPlay();
  }, 100);
  cur = c;
  surface.classList.add('playing');
  if (kind === 'voice') btn.textContent = '❚❚';
}
function togglePlay(i, kind) {
  if (cur && track.children[i]?.contains(cur.btn) && cur.kind === kind) return stopPlay();
  startPlay(i, kind);
}

/* ============ Действия ============ */
function bump(i, el) {
  haptic('medium');
  FRIENDS[i].updated = Date.now();
  refreshTimes();
  const c = track.children[i].querySelector('.card');
  c.classList.remove('bumping');
  void c.offsetWidth;
  c.classList.add('bumping');
  toast(`⚡ Бамп → ${FRIENDS[i].name}`);
  post(i, { type: 'bump' });
}

let replyTo = 0;
function openSheet(i) {
  replyTo = i;
  $('#shTo').textContent = `Ответ: ${FRIENDS[i].name}`;
  $('#sheet').classList.add('open');
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#msg').blur(); }
function sendReply() {
  const text = $('#msg').value.trim();
  if (!text) return toast('Напишите сообщение');
  post(replyTo, { type: 'text', text });
  haptic('success');
  toast(`Отправлено → ${FRIENDS[replyTo].name}`);
  $('#msg').value = '';
  closeSheet();
}

/* ============ Обработчики ============ */
track.addEventListener('click', e => {
  const p = e.target.closest('[data-play]');
  if (p) return togglePlay(+p.closest('.slide').dataset.i, p.dataset.play);
  const b = e.target.closest('[data-bump]');
  if (b) return bump(+b.dataset.bump, b);
  const r = e.target.closest('[data-reply]');
  if (r) openSheet(+r.dataset.reply);
});

let sx = 0, sy = 0;
const carousel = $('#carousel');
carousel.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
carousel.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, { passive: true });

$('#prev').addEventListener('click', () => go(-1));
$('#next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'Escape') closeSheet();
});

$('#shClose').addEventListener('click', closeSheet);
$('#shCancel').addEventListener('click', closeSheet);
$('#send').addEventListener('click', sendReply);
$('#sheet').addEventListener('click', e => {
  const chip = e.target.closest('.chips button');
  if (chip) $('#msg').value = chip.textContent.trim();
});

/* ============ Статус сети ============ */
function setStatus() {
  const on = navigator.onLine;
  const s = $('#status');
  s.classList.toggle('off', !on);
  s.querySelector('span').textContent = on ? 'ONLINE' : 'OFFLINE';
}
addEventListener('online', setStatus);
addEventListener('offline', setStatus);

/* ============ Telegram: имя, полноэкранный режим, ярлык на главный экран ============ */
let name = 'Тест';
if (TG) {
  TG.ready();
  TG.expand();
  name = TG.initDataUnsafe?.user?.first_name || name;
  if (TG.addToHomeScreen) $('#btnHome').hidden = false;
}
$('#greet').textContent = name;
$('#btnHome').addEventListener('click', () => TG?.addToHomeScreen?.());

/* ============ Старт ============ */
setStatus();
render();
go(0);
setInterval(refreshTimes, 30000);
</script>
</body>
</html>

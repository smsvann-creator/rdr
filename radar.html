<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RDR Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #09090c;
      --card: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent: #00f2fe;
      --accent-2: #4facfe;
      --text: #f4f4f6;
      --muted: #8e8e98;
      --danger: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #141829, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .btn-small {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .glass-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: #050508;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.15s;
    }

    .chat-item:active {
      transform: scale(0.98);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #23283d, #161926);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      color: var(--accent);
      flex-shrink: 0;
      border: 1px solid var(--card-border);
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .chat-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-preview.media {
      color: var(--accent);
      font-weight: 500;
    }

    .badge {
      background: var(--accent);
      color: #050508;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }

    .loader {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <span class="dot"></span>
        <span>RDR Hub</span>
      </div>
      <div id="header-actions" class="hidden">
        <button class="btn-small" onclick="loadDialogs()">Обновить</button>
        <button class="btn-small" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div id="loader" class="loader">Подключение к хабу...</div>

    <!-- Экран авторизации -->
    <div id="auth-screen" class="glass-card hidden">
      <div class="auth-title">Вход в Telegram</div>
      <div class="auth-sub">Подключи аккаунт, чтобы видеть свои реальные чаты и кружки в хабе.</div>

      <!-- Шаг 1: Номер -->
      <div id="step-phone">
        <div class="input-group">
          <input type="tel" id="phone-input" placeholder="+380..." />
        </div>
        <button class="btn-primary" onclick="sendCode()">Получить код</button>
      </div>

      <!-- Шаг 2: Код -->
      <div id="step-code" class="hidden">
        <div class="input-group">
          <input type="text" id="code-input" placeholder="Код из Telegram" />
        </div>
        <button class="btn-primary" onclick="verifyCode()">Подтвердить код</button>
      </div>

      <!-- Шаг 3: 2FA Пароль -->
      <div id="step-2fa" class="hidden">
        <div class="input-group">
          <input type="password" id="password-input" placeholder="Облачный пароль (2FA)" />
        </div>
        <button class="btn-primary" onclick="verifyPassword()">Войти</button>
      </div>

      <div id="auth-error" class="error-msg"></div>
    </div>

    <!-- Главный экран с реальными чатами -->
    <div id="hub-screen" class="hidden">
      <div id="chat-list" class="chat-list"></div>
    </div>
  </div>

  <script>
    // Замени на URL твоего FastAPI сервера
    const API_BASE = "https://твой-сервер.com";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Берем Telegram ID пользователя из Mini App (или тестовый для браузера)
    const userId = String(tg?.initDataUnsafe?.user?.id || "test_user_1");

    function showError(msg) {
      document.getElementById("auth-error").innerText = msg || "";
    }

    async function initApp() {
      try {
        const res = await fetch(`${API_BASE}/api/status/${userId}`);
        const data = await res.json();
        document.getElementById("loader").classList.add("hidden");

        if (data.authorized) {
          showHub();
        } else {
          document.getElementById("auth-screen").classList.remove("hidden");
        }
      } catch (e) {
        document.getElementById("loader").innerText = "Нет связи с сервером API";
      }
    }

    async function sendCode() {
      showError("");
      const phone = document.getElementById("phone-input").value.trim();
      if (!phone) return showError("Введите номер телефона");

      try {
        const res = await fetch(`${API_BASE}/api/auth/send_code`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, phone })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка отправки кода");

        document.getElementById("step-phone").classList.add("hidden");
        document.getElementById("step-code").classList.remove("hidden");
      } catch (e) {
        showError(e.message);
      }
    }

    async function verifyCode() {
      showError("");
      const code = document.getElementById("code-input").value.trim();
      if (!code) return showError("Введите код из Telegram");

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify_code`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Неверный код");

        if (data.status === "2fa_required") {
          document.getElementById("step-code").classList.add("hidden");
          document.getElementById("step-2fa").classList.remove("hidden");
        } else {
          showHub();
        }
      } catch (e) {
        showError(e.message);
      }
    }

    async function verifyPassword() {
      showError("");
      const password = document.getElementById("password-input").value;
      if (!password) return showError("Введите облачный пароль");

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify_password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Неверный пароль");

        showHub();
      } catch (e) {
        showError(e.message);
      }
    }

    async function showHub() {
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("hub-screen").classList.remove("hidden");
      document.getElementById("header-actions").classList.remove("hidden");
      await loadDialogs();
    }

    async function loadDialogs() {
      const listEl = document.getElementById("chat-list");
      listEl.innerHTML = `<div class="loader">Загрузка реальных чатов...</div>`;

      try {
        const res = await fetch(`${API_BASE}/api/dialogs/${userId}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка загрузки чатов");

        listEl.innerHTML = "";
        data.dialogs.forEach(chat => {
          const initial = (chat.title[0] || "?").toUpperCase();
          const isMedia = chat.type !== "text";
          const badgeHtml = chat.unread_count > 0 ? `<span class="badge">${chat.unread_count}</span>` : "";

          const item = document.createElement("div");
          item.className = "chat-item";
          item.innerHTML = `
            <div class="avatar">${initial}</div>
            <div class="chat-info">
              <div class="chat-top">
                <div class="chat-name">${escapeHtml(chat.title)}</div>
                <div class="chat-time">${chat.time}</div>
              </div>
              <div class="chat-bottom">
                <div class="chat-preview ${isMedia ? "media" : ""}">${escapeHtml(chat.last_message)}</div>
                ${badgeHtml}
              </div>
            </div>
          `;
          listEl.appendChild(item);
        });
      } catch (e) {
        listEl.innerHTML = `<div class="error-msg">${e.message}</div>`;
      }
    }

    async function logout() {
      await fetch(`${API_BASE}/api/auth/logout/${userId}`, { method: "POST" });
      location.reload();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    initApp();
  </script>
</body>
</html>
